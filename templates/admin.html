{% extends "base.html" %}
{% block title %}RoomSync - Administrator{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Administrator</h1>
</div>

<div class="admin-hub-grid">
    <a href="{{ url_for('admin_teachers') }}" class="admin-hub-card">
        <h2>Teachers</h2>
        <span class="hub-count">{{ counts.teachers }}</span>
        <span class="hub-link">Manage &rarr;</span>
    </a>
    <a href="{{ url_for('admin_students') }}" class="admin-hub-card">
        <h2>Students</h2>
        <span class="hub-count">{{ counts.students }}</span>
        <span class="hub-link">Manage &rarr;</span>
    </a>
    <a href="{{ url_for('admin_classes') }}" class="admin-hub-card">
        <h2>Classes</h2>
        <span class="hub-count">{{ counts.classes }}</span>
        <span class="hub-link">Manage &rarr;</span>
    </a>
    <a href="{{ url_for('admin_rooms') }}" class="admin-hub-card">
        <h2>Rooms</h2>
        <span class="hub-count">{{ counts.rooms }}</span>
        <span class="hub-link">Manage &rarr;</span>
    </a>
</div>
{% endblock %}
