{% extends "base.html" %}
{% block title %}RoomSync - Schedule Display{% endblock %}

{% block content %}
<div class="clock" id="clock"></div>

<div id="display-root" class="display-root"></div>

<script>
    const INITIAL_STATE = {{ initial_state|tojson }};
    let currentState = INITIAL_STATE;
    let clockSkew = 0;

    function syncSkew(serverTimeIso) {
        clockSkew = new Date(serverTimeIso).getTime() - Date.now();
    }
    syncSkew(currentState.server_time);

    function serverNow() {
        return Date.now() + clockSkew;
    }

    function escapeHtml(str) {
        if (str === null || str === undefined) return "";
        return String(str).replace(/[&<>"']/g, (c) => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[c]));
    }

    function fmtMMSS(totalSeconds) {
        totalSeconds = Math.max(0, Math.round(totalSeconds));
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        return `${m}:${s.toString().padStart(2, "0")}`;
    }

    // 24-hour time, the same as every other time in RoomSync. Built by hand
    // rather than with toLocaleString(), whose output (and 12- vs 24-hour
    // default) varies by browser and OS locale.
    const DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const MONTH_NAMES = ["January", "February", "March", "April", "May", "June",
                         "July", "August", "September", "October", "November", "December"];
    const pad2 = (n) => String(n).padStart(2, "0");

    function renderClock() {
        const d = new Date(serverNow());
        document.getElementById("clock").textContent =
            `${DAY_NAMES[d.getDay()]}, ${pad2(d.getDate())} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}` +
            ` · ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
    }

    // One box per enrolled student, filled in tap order: green for each
    // on-time tap, then amber for each late one, then outlined for the rest.
    function rosterBoxes(state) {
        const total = state.total_students ?? 0;
        const present = state.present_count ?? 0;
        const late = state.late_count ?? 0;
        return Array.from({ length: total }, (_, i) => {
            const cls = i < present ? "present" : i < present + late ? "late" : "absent";
            return `<div class="roster-box ${cls}"></div>`;
        }).join("");
    }

    function render() {
        const root = document.getElementById("display-root");
        const state = currentState;

        if (state.flash) {
            const cls = state.flash.type || "info";
            root.innerHTML = `<div class="stage-flash flash-${cls}">${escapeHtml(state.flash.message)}</div>`;
            return;
        }

        switch (state.stage) {
            case "teacher_early_confirm":
                root.innerHTML = `
                    <div class="stage-confirm">
                        <p class="confirm-question">Hello Sir/Ma'am ${escapeHtml(state.teacher_name)},
                        you are ${state.minutes_early} minute(s) in advance, do you want to proceed?</p>
                        <div class="confirm-buttons">
                            <button id="confirm-yes" class="btn-yes">Yes</button>
                            <button id="confirm-no" class="btn-no">No</button>
                        </div>
                    </div>`;
                document.getElementById("confirm-yes").onclick = () => sendConfirm("yes");
                document.getElementById("confirm-no").onclick = () => sendConfirm("no");
                break;

            case "teacher_early_wait": {
                const waitUntil = new Date(state.wait_until).getTime();
                const remainingMin = Math.max(0, Math.ceil((waitUntil - serverNow()) / 60000));
                root.innerHTML = `
                    <div class="stage-wait">
                        <h2>Welcome, Sir/Ma'am!</h2>
                        <p>Attendance starting in <strong>${remainingMin}</strong> minute(s), at ${escapeHtml(state.start_time)}</p>
                    </div>`;
                break;
            }

            case "attendance_open": {
                const endAt = new Date(state.countdown_end_at).getTime();
                const remainingSec = (endAt - serverNow()) / 1000;
                root.innerHTML = `
                    <div class="stage-open">
                        <h2>Hello Sir/Ma'am ${escapeHtml(state.teacher_name)}</h2>
                        <p class="class-name">${escapeHtml(state.subject_name)} &middot; ${escapeHtml(state.start_time)}&ndash;${escapeHtml(state.end_time)}</p>
                        <div class="countdown">${fmtMMSS(remainingSec)}</div>
                        <p class="hint">Tap your card</p>
                        <div class="roster-boxes">${rosterBoxes(state)}</div>
                        <p class="roster-count">${state.present_count ?? 0} of ${state.total_students ?? 0} present</p>
                    </div>`;
                break;
            }

            case "end_early_confirm":
                root.innerHTML = `
                    <div class="stage-confirm">
                        <p class="confirm-question">Do you want to end the class early?</p>
                        <div class="confirm-buttons">
                            <button id="end-early-yes" class="btn-yes">Yes</button>
                            <button id="end-early-no" class="btn-no">No</button>
                        </div>
                    </div>`;
                document.getElementById("end-early-yes").onclick = () => sendEndEarlyConfirm("yes");
                document.getElementById("end-early-no").onclick = () => sendEndEarlyConfirm("no");
                break;

            case "class_ongoing": {
                const total = state.total_students ?? 0;
                const tapped = (state.present_count ?? 0) + (state.late_count ?? 0);
                // Late taps are still accepted until end_time (see
                // handle_student_tap() in app.py) — say so, unless every
                // enrolled student is already in.
                const note = total > 0 && tapped >= total
                    ? "Attendance complete!"
                    : `Late check-in until ${escapeHtml(state.end_time)}`;
                root.innerHTML = `
                    <div class="stage-ongoing">
                        <h1>Class is Ongoing</h1>
                        <p class="class-name">${escapeHtml(state.subject_name)} &middot; Sir/Ma'am ${escapeHtml(state.teacher_name)} &middot; until ${escapeHtml(state.end_time)}</p>
                        <p class="hint">${note}</p>
                        <div class="roster-boxes">${rosterBoxes(state)}</div>
                        <p class="roster-count">
                            <span class="legend legend-present"></span>${state.present_count ?? 0} present
                            <span class="legend legend-late"></span>${state.late_count ?? 0} late
                            <span class="legend legend-absent"></span>${Math.max(0, total - tapped)} not yet
                        </p>
                    </div>`;
                break;
            }

            case "session_summary": {
                const expiresAt = new Date(state.summary_expires_at).getTime();
                const remainingSec = Math.max(0, Math.ceil((expiresAt - serverNow()) / 1000));
                const namesWith = (status) => (state.roster || [])
                    .filter((s) => s.status === status)
                    .map((s) => escapeHtml(s.name));
                const presentNames = namesWith("present");
                const lateNames = namesWith("late");
                const cancelButton = state.is_early_end
                    ? `<button id="summary-cancel" class="btn-cancel">Cancel</button>`
                    : "";
                root.innerHTML = `
                    <div class="stage-summary">
                        <h2>Session Summary</h2>
                        <p class="summary-line"><strong>Teacher:</strong> ${escapeHtml(state.teacher_name)}</p>
                        <p class="summary-line"><strong>Class:</strong> ${escapeHtml(state.subject_name)}</p>
                        <p class="summary-line"><strong>Present (${presentNames.length}/${state.total_students ?? 0}):</strong>
                            ${presentNames.length ? presentNames.join(", ") : "No students present"}</p>
                        <p class="summary-line"><strong>Late (${lateNames.length}):</strong>
                            ${lateNames.length ? lateNames.join(", ") : "None"}</p>
                        <p class="confirm-question">Is this information correct?</p>
                        <div class="confirm-buttons">
                            <button id="summary-yes" class="btn-yes">Yes</button>
                            <button id="summary-no" class="btn-no">No</button>
                            ${cancelButton}
                        </div>
                        <p class="hint">Auto-confirms in ${remainingSec}s</p>
                    </div>`;
                document.getElementById("summary-yes").onclick = () => sendSummaryConfirm("yes");
                document.getElementById("summary-no").onclick = () => sendSummaryConfirm("no");
                if (state.is_early_end) {
                    document.getElementById("summary-cancel").onclick = () => sendSummaryConfirm("cancel");
                }
                break;
            }

            case "session_summary_edit": {
                const expiresAt = new Date(state.summary_expires_at).getTime();
                const remainingSec = Math.max(0, Math.ceil((expiresAt - serverNow()) / 1000));
                const toggles = (state.roster || []).map((s) => `
                    <button class="roster-toggle ${s.status}" data-student-id="${s.student_id}">
                        ${escapeHtml(s.name)}
                        <small>${s.status.toUpperCase()}</small>
                    </button>
                `).join("");
                const editCancelButton = state.is_early_end
                    ? `<button id="summary-edit-cancel" class="btn-cancel">Cancel</button>`
                    : "";
                root.innerHTML = `
                    <div class="stage-summary">
                        <h2>Edit Attendance</h2>
                        <p class="hint">Tap a name to change it</p>
                        <div class="roster-toggle-grid">${toggles}</div>
                        <div class="confirm-buttons">
                            <button id="summary-save" class="btn-yes">Confirm</button>
                            ${editCancelButton}
                        </div>
                        <p class="hint">Auto-confirms in ${remainingSec}s</p>
                    </div>`;
                root.querySelectorAll(".roster-toggle").forEach((btn) => {
                    btn.onclick = () => sendSummaryToggle(btn.dataset.studentId);
                });
                document.getElementById("summary-save").onclick = () => sendSummaryConfirm("yes");
                if (state.is_early_end) {
                    document.getElementById("summary-edit-cancel").onclick = () => sendSummaryConfirm("cancel");
                }
                break;
            }

            case "welcome":
            default:
                root.innerHTML = `
                    <div class="stage-welcome">
                        <h1>WELCOME</h1>
                        <p>Tap your card to begin</p>
                    </div>`;
                break;
        }
    }

    function postJSON(url, body) {
        fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
        })
            .then((r) => r.json())
            .then((data) => {
                currentState = data;
                syncSkew(data.server_time);
                render();
            })
            .catch(() => {});
    }

    function sendConfirm(action) {
        postJSON("/api/teacher_confirm", { action });
    }

    function sendEndEarlyConfirm(action) {
        postJSON("/api/end_early_confirm", { action });
    }

    function sendSummaryConfirm(action) {
        postJSON("/api/session_summary_confirm", { action });
    }

    function sendSummaryToggle(studentId) {
        postJSON("/api/session_summary_toggle", { student_id: Number(studentId) });
    }

    function poll() {
        fetch("/api/display_state")
            .then((r) => r.json())
            .then((data) => {
                currentState = data;
                syncSkew(data.server_time);
                render();
            })
            .catch(() => {});
    }

    render();
    renderClock();
    setInterval(render, 1000);
    setInterval(renderClock, 1000);
    setInterval(poll, 2500);
</script>
{% endblock %}
